name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "src/**"
      - "scripts/package-lambdas.sh"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-image-pipeline-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan-only:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "431655581157"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - run: ./scripts/package-lambdas.sh
      - run: terraform -chdir=terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -no-color

  apply:
    if: github.event_name == 'push' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "431655581157"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pytest
      - run: aws sts get-caller-identity
      - run: ./scripts/package-lambdas.sh
      - run: terraform -chdir=terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -out=tfplan
      - run: terraform -chdir=terraform apply -input=false -auto-approve tfplan
      - name: Populate frontend after infrastructure deployment
        run: ./scripts/deploy-frontend.sh
