name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "src/**"
      - "scripts/package-lambdas.sh"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-image-pipeline-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan-only:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "431655581157"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - run: ./scripts/package-lambdas.sh
      - run: terraform -chdir=terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -no-color

  apply:
    if: github.event_name == 'push' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Show selected AWS role
        run: echo "role=${{ vars.AWS_DEPLOY_ROLE_ARN }}"

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request_url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com"
          )

          request = urllib.request.Request(
              request_url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("aud", "sub", "repository", "repository_id",
                      "environment", "ref", "job_workflow_ref"):
              print(f"{key}={claims.get(key)}")
          PY

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "431655581157"
          retry-max-attempts: 2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pytest
      - run: aws sts get-caller-identity
      - run: ./scripts/package-lambdas.sh
      - run: terraform -chdir=terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -out=tfplan
      - run: terraform -chdir=terraform apply -input=false -auto-approve tfplan
      - name: Populate frontend after infrastructure deployment
        run: ./scripts/deploy-frontend.sh
